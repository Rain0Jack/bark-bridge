services:
  bark-bridge:
    image: python:3.12-alpine
    container_name: bark-bridge
    restart: unless-stopped
    # 使用 host 网络：容器内的 127.0.0.1 就是宿主机，
    # 这样 NTFY_BASE_URL=http://127.0.0.1:40265 可以直接访问本机 ntfy。
    # 若 ntfy 在别的机器/容器网络，删掉这行并改 NTFY_BASE_URL。
    network_mode: host
    env_file:
      - .env
    volumes:
      # 以只读方式挂载脚本：改代码后 docker compose restart 即可，无需重新构建
      - ./bark-bridge.py:/app/bark-bridge.py:ro
    command: ["python3", "/app/bark-bridge.py"]
