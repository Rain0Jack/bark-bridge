services:
  bark-bridge:
    image: python:3.12-alpine
    container_name: bark-bridge
    restart: unless-stopped
    # 使用 host 网络：容器内的 127.0.0.1 就是宿主机，
    # 这样 NTFY_BASE_URL=http://127.0.0.1:40265 可以直接访问本机 ntfy，
    # WebUI 也直接监听 .env 里的 PORT（默认 8080），无需再映射端口。
    # 若 ntfy 在别的机器/容器网络，删掉这行并改 NTFY_BASE_URL。
    network_mode: host
    env_file:
      - .env
    environment:
      # 容器内固定用 /app/data，宿主机上落在 ./data
      DATA_DIR: /app/data
    volumes:
      # 目录挂载（可写）：WebUI 的「在线更新」需要替换 bark-bridge.py / webui.html
      # 并原地重启，所以要整个目录可写挂载。
      # 不要改成 ./bark-bridge.py:/app/bark-bridge.py:ro 这种单文件只读挂载，
      # 否则 WebUI 会提示「程序目录不可写，无法在线更新」。
      - ./:/app
    command: ["python3", "/app/bark-bridge.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
